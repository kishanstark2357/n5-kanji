<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N5 Kanji Trainer</title>
<style>
:root{--bg:#eaf3fa;--card:#fff;--ink:#3b2a20;--mut:#7a6a60;--acc:#c0622f;--ok:#2e8b57;--bad:#c0392b;--line:#d9e2ea}
@media(prefers-color-scheme:dark){:root{--bg:#171c22;--card:#232a32;--ink:#f1e8e0;--mut:#9aa5b0;--acc:#e8905c;--ok:#4fc183;--bad:#ef6b5c;--line:#34404b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
#app{max-width:680px;margin:0 auto;padding:20px 16px 60px}
h1{text-align:center;margin:10px 0 4px}
.sub{text-align:center;color:var(--mut);margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
button{font:inherit;color:inherit;cursor:pointer}
.big{display:block;width:100%;padding:20px;margin-bottom:12px;border:2px solid var(--acc);background:var(--card);border-radius:14px;font-size:1.2rem;font-weight:600}
.big small{display:block;font-weight:400;color:var(--mut);font-size:.9rem}
.big:hover,.opt:hover{background:var(--acc);color:#fff}.big:hover small{color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:130px;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:10px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{padding:14px 8px;border:2px solid var(--line);background:var(--card);border-radius:12px;font-size:1.3rem}
.opt.sel{border-color:var(--acc);background:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok);color:#fff}.opt.no{border-color:var(--bad);background:var(--bad);color:#fff}
.kbig{font-size:5rem;text-align:center;line-height:1.2}
.jp{font-size:1.2rem;font-weight:600}.jp u{text-decoration-thickness:2px;text-underline-offset:5px;color:var(--acc)}
.en{color:var(--mut);font-size:.92rem;margin-top:4px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.9rem}
.link{background:none;border:0;color:var(--acc);padding:4px}
.nav{display:flex;justify-content:space-between;margin-top:16px;gap:10px}
.go{padding:12px 22px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-weight:600}.go:disabled{opacity:.4}
.score{font-size:3rem;text-align:center;font-weight:700;color:var(--acc)}
.rev{border-left:4px solid var(--bad);padding-left:10px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.grid div{text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 2px;font-size:1.6rem}.grid small{display:block;font-size:.65rem;color:var(--mut)}
@media(max-width:420px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const RAW=`一|1|一つ|ひとつ
二|2|二つ|ふたつ
三|3|三つ|みっつ
四|4|四つ|よっつ
五|5|五つ|いつつ
六|6|六つ|むっつ
七|7|七つ|ななつ
八|8|八つ|やっつ
九|9|九つ|ここのつ
十|10|十日|とおか
百|100|百|ひゃく
千|1,000|千|せん
万|10,000|万|まん
日|sun|日|ひ
月|moon|月|つき
火|fire|火|ひ
水|water|水|みず
木|tree|木|き
金|gold|金|かね
土|soil|土|つち
本|book|本|ほん
語|language|語|ご
人|person|人|ひと
女|woman|女|おんな
男|man|男|おとこ
子|child|子|こ
友|friend|友|とも
国|country|国|くに
学|study|学ぶ|まなぶ
校|school|校|こう
小|small|小さい|ちいさい
大|big|大きい|おおきい
少|few|少ない|すくない
多|many|多い|おおい
時|hour|時|とき
分|minute|分かる|わかる
年|year|年|とし
名|name|名|な
前|in front|前|まえ
後|behind|後ろ|うしろ
山|mountain|山|やま
川|river|川|かわ
花|flower|花|はな
魚|fish|魚|さかな
上|above|上|うえ
中|inside|中|なか
下|below|下|した
左|left|左|ひだり
右|right|右|みぎ
外|outside|外|そと
雨|rain|雨|あめ
電|electricity|電|でん
天|heavens|天|てん
店|store|店|みせ
手|hand|手|て
古|old|古い|ふるい
新|new|新しい|あたらしい
買|buy|買う|かう
生|life|生まれる|うまれる
午|midday|午|ご
口|mouth|口|くち
入|enter|入る|はいる
出|exit|出る|でる
長|long|長い|ながい
高|tall|高い|たかい
円|circle|円|えん
北|north|北|きた
南|south|南|みなみ
東|east|東|ひがし
西|west|西|にし
食|eat|食べる|たべる
飲|drink|飲む|のむ
駅|station|駅|えき
目|eye|目|め
見|see|見る|みる
耳|ear|耳|みみ
聞|listen|聞く|きく
足|foot|足|あし
行|go|行く|いく
来|come|来る|くる
社|company|社|しゃ
休|rest|休む|やすむ
車|vehicle|車|くるま
道|road|道|みち
空|air|空|そら
言|word|言う|いう
話|talk|話す|はなす
読|read|読む|よむ
書|write|書く|かく
立|stand|立つ|たつ
母|mother|母|はは
父|father|父|ちち
毎|every|毎|まい
気|feeling|気|き
白|white|白い|しろい
何|what|何|なに
週|week|週|しゅう
間|between|間|あいだ
半|half|半|はん
今|now|今|いま`;
const D=RAW.split("\n").map(l=>{const[k,m,w,r]=l.split("|");return{k,m,w,r}});
const SIM="日目白,木本休,大天,小少,人入,土上,千十,口中円,右左,北南,東西,聞間,話語読言,母毎,店古,上下,前後".split(",");
const TESTS=[
 {name:"Test 1",sub:"Kanji 1–50 (numbers → school…)",ids:r(0,50)},
 {name:"Test 2",sub:"Kanji 51–100 (mountain → now)",ids:r(50,100)},
 {name:"Test 3",sub:"Mixed: kanji 26–75",ids:r(25,75)},
 {name:"Test 4",sub:"Mixed: kanji 1–25 + 76–100",ids:r(0,25).concat(r(75,100))},
 {name:"Full Test",sub:"All 100 kanji",ids:r(0,100)}];
function r(a,b){return Array.from({length:b-a},(_,i)=>a+i)}
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const $=document.getElementById("app");
let S={};

function distract(it,key,type){
  let pool=D.filter(d=>d.k!==it.k&&d.r!==it.r&&d[key]!==it[key]);
  if(type==="k"||type==="o"){const g=SIM.find(s=>s.includes(it.k))||"";
    pool=sh(pool).sort((a,b)=>(g.includes(b.k)?1:0)-(g.includes(a.k)?1:0))}
  else pool=sh(pool);
  const seen=new Set([it[key]]),out=[];
  for(const d of pool){if(!seen.has(d[key])){seen.add(d[key]);out.push(d[key]);if(out.length==3)break}}
  return out;
}
function mk(it,t){
  let q={t,it};
  if(t==="R"){q.jp=`<u>${it.w}</u> の ことばは ひらがなで どう かきますか。`;q.en="How do you write the underlined word in hiragana?";q.key="r"}
  if(t==="O"){q.jp=`<u>${it.r}</u> の ことばは どう かきますか。`;q.en=`How do you write the underlined word in kanji? (meaning: “${it.m}”)`;q.key="w"}
  if(t==="M"){q.jp=`「${it.m}」の かんじは どれですか。`;q.en=`Which kanji means “${it.m}”?`;q.key="k"}
  if(t==="K"){q.big=it.k;q.jp="この かんじの いみは なんですか。";q.en="What does this kanji mean?";q.key="m"}
  const dk=t==="O"?"w":q.key;
  let ds=distract(it,dk,t==="O"?"o":t==="M"?"k":"x");
  q.opts=sh([it[q.key],...ds]);q.ans=it[q.key];
  return q;
}
function home(){
  $.innerHTML=`<h1>N5 漢字 Trainer</h1><div class="sub">100 N5 kanji · practice &amp; JLPT-style tests</div>
  <button class="big" onclick="practiceMenu()">📖 Practice<small>Instant feedback, unlimited questions</small></button>
  <button class="big" onclick="testMenu()">📝 Take a Test<small>JLPT N5 format · random order · English translation</small></button>
  <button class="big" onclick="chart()">🈶 Kanji Chart<small>See all 100 kanji with meanings</small></button>`;
}
function chart(){
  $.innerHTML=`<button class="link" onclick="home()">← Back</button><div class="card"><div class="grid">${D.map(d=>`<div>${d.k}<small>${d.m}</small></div>`).join("")}</div></div>`;
}
function practiceMenu(){
  $.innerHTML=`<button class="link" onclick="home()">← Back</button><h1>Practice</h1><div class="sub">Choose a mode</div>
  <button class="big" onclick="startP('M')">Meaning → Kanji<small>“What is the kanji for ‘to live’?” pick the kanji</small></button>
  <button class="big" onclick="startP('K')">Kanji → Meaning<small>See a kanji, pick its meaning</small></button>
  <button class="big" onclick="startP('R')">Kanji → Reading<small>Pick the hiragana reading</small></button>
  <button class="big" onclick="startP('X')">Mixed<small>All three together</small></button>`;
}
function nextP(){
  const t=S.pt==="X"?sh(["M","K","R"])[0]:S.pt,it=D[Math.random()*100|0];
  S.q=mk(it,t);S.done=false;drawP();
}
function startP(t){S={mode:"p",pt:t,n:0,ok:0,streak:0};nextP()}
function qBody(q){
  return `${q.big?`<div class="kbig">${q.big}</div>`:""}<div class="jp">${q.jp}</div><div class="en">${q.en}</div>`;
}
function drawP(){
  const q=S.q;
  $.innerHTML=`<div class="top"><button class="link" onclick="practiceMenu()">← Modes</button><span>✓ ${S.ok}/${S.n} · 🔥 ${S.streak}</span></div>
  <div class="card">${q.t==="R"?`<div class="kbig">${q.it.w}</div>`:""}${qBody(q).replace(/<u>(.*?)<\/u>/,"$1")}
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="ansP(${i})">${o}</button>`).join("")}</div>
  <div class="nav"><span></span><button class="go" id="nx" disabled onclick="nextP()">Next →</button></div></div>`;
}
function ansP(i){
  if(S.done)return;S.done=true;S.n++;
  const q=S.q,b=document.querySelectorAll(".opt");
  const good=q.opts[i]===q.ans;
  if(good){S.ok++;S.streak++}else S.streak=0;
  b.forEach((x,j)=>{if(q.opts[j]===q.ans)x.classList.add("ok");else if(j===i)x.classList.add("no")});
  const c=document.querySelector(".card");
  c.insertAdjacentHTML("beforeend",`<div class="en" style="margin-top:10px">${q.it.k} = ${q.it.m} · ${q.it.w} (${q.it.r})</div>`);
  document.getElementById("nx").disabled=false;
}
function testMenu(){
  let best={};try{best=JSON.parse(localStorage.getItem("n5best")||"{}")}catch(e){}
  $.innerHTML=`<button class="link" onclick="home()">← Back</button><h1>Tests</h1><div class="sub">Question order and types are re-shuffled every attempt</div>
  ${TESTS.map((t,i)=>`<button class="big" onclick="startT(${i})">${t.name} · ${t.ids.length} questions<small>${t.sub}${best[i]!=null?` · Best: ${best[i]}%`:""}</small></button>`).join("")}`;
}
function startT(i){
  const t=TESTS[i];
  const qs=sh(t.ids).map(id=>mk(D[id],sh(["R","O","M"])[0]));
  S={mode:"t",ti:i,qs,i:0,pick:Array(qs.length).fill(null)};drawT();
}
function drawT(){
  const q=S.qs[S.i],n=S.qs.length;
  $.innerHTML=`<div class="top"><button class="link" onclick="if(confirm('Quit this test?'))testMenu()">✕ Quit</button><span>${TESTS[S.ti].name} · ${S.i+1}/${n}</span></div>
  <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
  <div class="card">${qBody(q)}
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt ${S.pick[S.i]===i?"sel":""}" onclick="pickT(${i})">${o}</button>`).join("")}</div>
  <div class="nav"><button class="go" style="background:var(--mut)" ${S.i?"":"disabled"} onclick="S.i--;drawT()">← Back</button>
  <button class="go" ${S.pick[S.i]==null?"disabled":""} onclick="${S.i==n-1?"finish()":"S.i++;drawT()"}">${S.i==n-1?"Finish ✓":"Next →"}</button></div></div>`;
}
function pickT(i){S.pick[S.i]=i;drawT()}
function finish(){
  const n=S.qs.length;let ok=0,wr=[];
  S.qs.forEach((q,i)=>{q.opts[S.pick[i]]===q.ans?ok++:wr.push([q,S.pick[i]])});
  const pct=Math.round(ok/n*100);
  try{const b=JSON.parse(localStorage.getItem("n5best")||"{}");if(b[S.ti]==null||pct>b[S.ti]){b[S.ti]=pct;localStorage.setItem("n5best",JSON.stringify(b))}}catch(e){}
  $.innerHTML=`<h1>Result</h1><div class="card"><div class="score">${ok} / ${n}</div><div class="sub">${pct}% · ${pct>=80?"Excellent! 🎉":pct>=60?"Good, keep going 💪":"Keep practicing 📖"}</div>
  <div class="nav"><button class="go" onclick="startT(${S.ti})">Retake</button><button class="go" onclick="testMenu()">Menu</button></div></div>
  ${wr.length?`<h3>Review (${wr.length} wrong)</h3>`:""}
  ${wr.map(([q,p])=>`<div class="card rev">${qBody(q)}<div style="margin-top:8px">Your answer: <b style="color:var(--bad)">${p==null?"—":q.opts[p]}</b><br>Correct: <b style="color:var(--ok)">${q.ans}</b><br><span class="en">${q.it.k} = ${q.it.m} · ${q.it.w} (${q.it.r})</span></div></div>`).join("")}`;
  scrollTo(0,0);
}
home();
</script>
</body>
</html>
